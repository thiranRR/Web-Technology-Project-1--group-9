<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Connect With Lecturers</title>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/phosphor.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f7fb;
    }
	nav {
  position: fixed;
  top: 0;
  width: 100%;
  background: linear-gradient(to right, #D2C1B6, #456882);
  display: flex;
  justify-content: center;
  gap: 60px;
  padding: 1rem 2rem;
  z-index: 1000;
  align-items: center;
}

nav a {
  text-decoration: none;
  color: #fff;
  font-weight: bold;
  font-size: 1rem;
  transition: transform 0.3s ease;
  display: flex;
  align-items: center;
  gap: 0.3rem;
}

nav a:hover {
  transform: translateY(-4px);
}

.profile-icon {
  font-size: 1.2rem;
}

.nav-search {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.nav-search input[type="text"] {
  padding: 0.3rem 0.6rem;
  border-radius: 20px;
  border: none;
  font-size: 1rem;
  outline: none;
  transition: box-shadow 0.3s ease;
  width: 180px;
  max-width: 100%;
}

.nav-search input[type="text"]:focus {
  box-shadow: 0 0 8px var(--accent);
}

.nav-search button {
  background: var(--accent);
  border: none;
  border-radius: 50%;
  padding: 0.3rem 0.4rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.3s ease;
}

.nav-search button:hover {
  background: #5bd5db;
}


    .banner {
      background: url('img1.avif') center/cover no-repeat;
      color: #ffffff;
      text-align: center;
      padding: 80px 20px;
      background-blend-mode: lighten;
      background-color: rgba(255, 255, 255, 0.7);
    }

    .banner h1 {
      font-size: 36px;
      margin-bottom: 10px;
      color: #003366;
    }

    .banner p {
      font-size: 18px;
      color: #333;
    }

  

    .info, .form {
      flex: 1;
      min-width: 280px;
      padding: 20px;
    }

    .info h3 {
      color: #003366;
      margin-bottom: 10px;
    }

    .info p {
      margin: 5px 0;
      color: #333;
    }
	
	.form {
      max-width: 600px;
      margin: 50px auto;
	  background-color: #ffffff;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    form label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      color: #333;
    }

    form input, form textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 16px;
    }

    textarea {
      resize: vertical;
      height: 150px;
    }

    form input[type="submit"] {
      margin-top: 20px;
      background-color: #003366;
      color: white;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    form input[type="submit"]:hover {
      background-color: #0055aa;
    }

   

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
    }
	footer {
  background: linear-gradient(to right, #D2C1B6, #456882);
  color: white;
  padding: 30px 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  width: 100%;
}

.footer-container {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 20px;
  gap: 20px;
}

.footer-left {
  flex: 1;
  min-width: 250px;
}

.site-name {
  font-size: 2rem;
  font-weight: 700;
  font-family: 'Georgia', serif;
  margin-bottom: 10px;
  text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.2);
}

.footer-center {
  flex: 1;
  display: flex;
  justify-content: center;
  min-width: 150px;
}

.about-btn {
  background-color: rgba(255, 255, 255, 0.2);
  color: white;
  border: 1px solid white;
  padding: 10px 25px;
  border-radius: 25px;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.3s ease;
}

.about-btn:hover {
  background-color: rgba(255, 255, 255, 0.3);
  transform: translateY(-2px);
}

.footer-right {
  flex: 1;
  min-width: 250px;
}

.contact-info {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.contact-item {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.9rem;
}

.contact-icon {
  font-size: 1.1rem;
  width: 20px;
  text-align: center;
}

@media (max-width: 768px) {
  .footer-container {
    flex-direction: column;
    text-align: center;
    gap: 30px;
  }

  .footer-center {
    order: 3;
    width: 100%;
  }

  .contact-info {
    align-items: center;
  }

  .contact-item {
    justify-content: center;
  }
}

  </style>
</head>
<body>

   <!-- Navbar -->
    <nav>
        <a href="home.html">Home</a>
        <a href="my-project.html">My Projects</a>
        <a href="contact.html">Contact</a>
        <a href="profile.html"><i class="ph-user-circle profile-icon"></i>My Profile</a>
        <form class="nav-search" onsubmit="handleSearch(event)">
            <input type="text" id="searchInput" placeholder="Search publications..." aria-label="Search publications" />
            <button type="submit" aria-label="Search">
                <i class="fas fa-search"></i>

            </button>
        </form>
    </nav>


  <div class="banner">
    <h1>We’d love to hear from you</h1>
    <p>Whether you have a question about enything,our team is ready to answer all your questions.</p>
  </div>



    <div class="form">
      <form action="mailto:yourgroupemail@example.com" method="post" enctype="text/plain">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="Name" required>

        <label for="email">Your Email</label>
        <input type="email" id="email" name="Email" required>

        <label for="query">Type of Query</label>
        <input type="text" id="query" name="Query">

        <label for="message">Your Message</label>
        <textarea id="message" name="Message" required></textarea>

        <input type="submit" value="Send Message">
      </form>
    </div>
  </div>
  
   <footer>
  <div class="footer-container">
    <div class="footer-left">
      <div class="site-name">Scholar Connect</div>
      <p>Your gateway to academic excellence.</p>
    </div>
    <div class="footer-center">
      <button class="about-btn" onclick="location.href='index.html#about'">About Us</button>
    </div>
    <div class="footer-right">
      <div class="contact-info">
        <div class="contact-item">
          <span class="contact-icon ph-envelope"></span>
          scholarconnect@example.com
        </div>
        <div class="contact-item">
          <span class="contact-icon ph-phone"></span>
          +1 (234) 567-8901
        </div>
      </div>
    </div>
  </div>
</footer>

<script>
   
    const publications = [
      { title: "Deep Learning for Natural Language Processing" },
      { title: "Quantum Computing Advances" },
      { title: "Renewable Energy Technologies" },
      { title: "AI in Healthcare" },
      { title: "Data Privacy and Security" },
      { title: "Machine Learning in Education" }
    ];

    function handleSearch(event) {
            event.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            if (!query) {
               alert("Please enter keywords to search.");
               return;
            }
            window.location.href = `research-opportunity.html?query=${encodeURIComponent(query)}`;
    }
</script>

 

</body>
</html>
