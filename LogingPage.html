 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Page</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/phosphor-icons/2.0.2/phosphor.min.css">
  <link rel="stylesheet" href="login1.css">
</head>
<body>
  <nav>
    <a href="index.html#home">Home</a>
    <a href="my-project.html">My Projects</a>
    <a href="contact_us.html">Contact</a>
    <a href="profile.html"><i class="ph-user-circle profile-icon"></i>My Profile</a>
    <form class="nav-search" onsubmit="handleSearch(event)">
      <input type="text" id="searchInput" placeholder="Search publications..." aria-label="Search publications" />
      <button type="submit" aria-label="Search">
        <i class="ph-magnifying-glass"></i>
      </button>
    </form>
  </nav>

  <div class="main-content">
    <div class="container">
      <div class="tabs">
        <button id="studentBtn" onclick="showForm('student')">Login as a Student</button>
        <button id="lecturerBtn" onclick="showForm('lecturer')">Login as a Lecturer</button>
      </div>
      <form id="studentForm" class="login-form">
        <h2>Student Login</h2>
        <input type="text" placeholder="Matric No or Email" required>
        <input type="password" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
      <form id="lecturerForm" class="login-form hidden">
        <h2>Lecturer Login</h2>
        <input type="text" placeholder="Lecturer ID or Email" required>
        <input type="password" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
      <p class="link">Don't have an account? <a href="createaccount.html">Create one</a></p>
    </div>
  </div>

  <footer>
    <div class="footer-container">
      <div class="footer-left">
        <div class="site-name">Scholar Connect</div>
        <p>Your gateway to academic excellence.</p>
      </div>
      <div class="footer-center">
        <button class="about-btn" onclick="location.href='about.html'">About Us</button>
      </div>
      <div class="footer-right">
        <div class="contact-info">
          <div class="contact-item">
            <span class="contact-icon ph-envelope"></span>
            scholarconnect@example.com
          </div>
          <div class="contact-item">
            <span class="contact-icon ph-phone"></span>
            +1 (234) 567-8901
          </div>
        </div>
      </div>
    </div>
  </footer>

  <script>
    function showForm(role) {
      document.getElementById('studentForm').classList.add('hidden');
      document.getElementById('lecturerForm').classList.add('hidden');
      if (role === 'student') {
        document.getElementById('studentForm').classList.remove('hidden');
        document.getElementById('studentBtn').style.background = '#2563eb';
        document.getElementById('lecturerBtn').style.background = '#3b82f6';
      } else {
        document.getElementById('lecturerForm').classList.remove('hidden');
        document.getElementById('lecturerBtn').style.background = '#2563eb';
        document.getElementById('studentBtn').style.background = '#3b82f6';
      }
    }

    function handleSearch(event) {
    event.preventDefault();
    const query = document.getElementById('searchInput').value.trim();
    if (!query) {
        alert("Please enter keywords to search.");
        return;
    }
    window.location.href = `Research-Opportunities.html?query=${encodeURIComponent(query)}`;
}

    
    showForm('student');
  </script>

</body>
</html>
